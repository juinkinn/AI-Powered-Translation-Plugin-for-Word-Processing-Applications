<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>AI Translator</title>
    <link rel="stylesheet" type="text/css" href="taskpane.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <script src="taskpane.js"></script>
</head>
<body>
    <div id="container">
        <h2>AI-Powered Translation Plugin</h2>
        
        <label>Source Language:</label>
        <select id="sourceLang"></select>

        <label>Target Language:</label>
        <select id="targetLang"></select>

        <label>Translation Style:</label>
        <select id="style">
            <option value="neutral">Neutral (Default)</option>
            <option value="formal_academic">Formal Academic</option>
            <option value="professional_business">Professional Business</option>
            <option value="technical">Technical</option>
            <option value="casual">Casual</option>
        </select>

        <label>Temperature:</label>
        <div class="slider-container">
            <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.5" 
                   oninput="updateSliderValue(this.value)">
            <div class="slider-value" id="tempValue">0.5</div>
        </div>

        <button onclick="translateSelectedText()">Translate Selected Text</button>
        <button onclick="translateWholeText()">Translate Whole Document</button>

        <!-- Popup Dialog -->
        <div id="customPopup" class="popup">
            <div class="popup-content">
                <span class="close-btn" onclick="closePopup()">&times;</span>
                <pre id="popupContent"></pre>
            </div>
        </div>
    </div>
</body>
</html>
